server {
    listen 81;
    listen [::]:81;
    server_name _;

    root /www/wwwroot/www;
    index index.html index.htm;

    charset utf-8;
    client_max_body_size 64m;

    access_log /var/log/nginx/fyqst.access.log;
    error_log  /var/log/nginx/fyqst.error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源缓存
    location ~* \.(png|jpg|jpeg|gif|ico|css|js|json|mp3|ogg|wav|ttf|woff2?|svg|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 原来的 PHP 层（登录/注册网关、GM 后台、CDK 平台）已整体用 C++ 重写，
    # 由本机 127.0.0.1:9500 的 fyweb 提供服务；nginx 只做反向代理。
    location ~ \.php$ {
        proxy_pass http://127.0.0.1:9500;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
