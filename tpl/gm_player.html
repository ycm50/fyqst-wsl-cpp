<!DOCTYPE html>
<html>
<head>
 <meta charset="utf-8">
 <meta http-equiv="X-UA-Compatible" content="IE=edge">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>绯雨骑士团H5后台</title>
 <link rel="stylesheet" href="css/bootstrap.min.css">
 <link rel="stylesheet" href="layui/css/layui.css" media="all">
 <script src="js/jquery-1.11.0.min.js?v={{t}}" type="text/javascript"></script>
 <script type="text/javascript" src="layer/layer.js"></script>
 <script src="js/bootstrap.min.js" type="text/javascript"></script>
 <link rel="stylesheet" href="css/bootstrap-select.min.css">
 <script src="js/bootstrap-select.min.js"></script>
</head>
<body>
 <div class="container">
   <br>
   <div class="row">
     <div class="container-fluid">
  <div class="modal-dialog">
    <div class="modal-content">
      <ul class="breadcrumb">
				<li>
					 <b>绯雨骑士团H5玩家后台</b>
				</li>
			</ul>
      <div class="modal-body">
   <div class="form-horizontal" role="form">
                <div class="form-group">
                    <div class="col-sm-10">
                        <input type="password" id="pwd" name="pwd" class="form-control" maxlength="16" value="" placeholder="输入授权密码" required>
                    </div>
                </div>
				<div class="form-group">
                    <div class="col-sm-10">
                        <select id="qu" name="qu" class="form-control selectpicker" data-size="5" title="请选择区服" required>
{{qu_options}}
                        </select>
                    </div>
                </div>
				<div class="form-group">
                    <div class="col-sm-10">
                        <input type="text" id="uid" name="uid" class="form-control" value="" placeholder="请输入角色名" required>
                    </div>
                </div>

				<div class="form-group">
                    <div class="col-sm-10">
                   	<select id="chargenum" name="chargenum" class="form-control selectpicker" data-size="5" title="请选择金额" required>
                            <option value="1">6元</option>
                            <option value="2">12元</option>
                            <option value="3">30元</option>
                            <option value="4">98元</option>
                            <option value="5">198元</option>
                            <option value="6">498元</option>
                            <option value="7">988元</option>
                            <option value="31">天命基金</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <div class=" col-sm-10">
						<button type="submit" class="btn btn-danger btn-block" onclick="chargebtn()">角色充值</button>
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-sm-10">
                        <select id="mailid" name="mailid" class="selectpicker show-tick form-control" data-live-search="true" data-size="5" title="选物品">
{{item_options}}
                        </select>
                    </div>
                </div>
				<div class="form-group">
                    <div class="col-sm-10">
                        <input type="text" id="mailnum" name="mailnum" class="form-control" min="0" max="9999" value="" placeholder="数量" required>
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-sm-10">
						<button type="submit" class="btn btn-primary" onclick="send_mail()">邮件发送</button>
                        <button type="submit" class="btn btn-primary" onclick="shuoming()">使用必看</button>
					</div>
                </div>
            </div>
      </div>
    </div>
  </div>
     </div>
   </div>
 </div>
 <script src="js/playermsg.js?v={{t}}"></script>
</body>
</html>
